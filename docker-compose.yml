# Local development services. Start with: docker compose up -d
services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: novyra
      POSTGRES_PASSWORD: novyra
      POSTGRES_DB: novyra
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the shadow and test databases on first start.
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novyra -d novyra"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    # Catches every email sent in development. Web UI: http://localhost:8025
    image: axllent/mailpit:v1.31.5
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
